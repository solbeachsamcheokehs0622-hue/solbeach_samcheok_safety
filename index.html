<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>쏠비치 삼척 근로자 게시자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-deep:#123C63;
    --blue:#1D6FB0;
    --blue-mid:#2C7FC1;
    --sea-foam:#3FA9C5;
    --sun:#F2A93B;
    --sand:#FAF6ED;
    --paper:#FFFFFF;
    --ink:#16324F;
    --ink-soft:#5B7285;
    --line: rgba(18,60,99,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;}
  .eyebrow{ font-size:11px; font-weight:700; letter-spacing:0.16em; color:var(--ink-soft); }

  .topbar{
    background:linear-gradient(155deg, var(--blue-deep) 0%, var(--blue-mid) 100%);
    color:#fff;
    padding:24px 20px 20px;
  }
  .topbar .eyebrow{ color:#AFCBE3; }

  /* ===== 날씨 카드 (탭과 무관하게 항상 표시) ===== */
  .weather-card{
    margin:16px 20px 0;
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    box-shadow:0 1px 3px rgba(18,60,99,0.06);
  }
  .weather-card .wi{
    flex-shrink:0;
    font-size:28px;
    line-height:1;
  }
  .weather-card .w-body{ flex:1; min-width:0; }
  .weather-card .w-temp{
    font-size:16px;
    font-weight:800;
    color:var(--ink);
  }
  .weather-card .w-sub{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .weather-card .wlv{
    flex-shrink:0;
    font-size:11px;
    font-weight:800;
    padding:4px 10px;
    border-radius:999px;
    background:rgba(63,169,197,0.14);
    color:var(--sea-foam);
  }
  .weather-card.lv-caution .wlv{ background:rgba(242,169,59,0.18); color:#B9760F; }
  .weather-card.lv-warning .wlv{ background:rgba(230,140,40,0.2); color:#B85E0F; }
  .weather-card.lv-danger .wlv{ background:rgba(216,85,61,0.16); color:#B23F28; }
  .weather-card.lv-error .w-temp{ color:var(--ink-soft); font-weight:600; font-size:13px; }
  .weather-card .w-naver{
    flex-shrink:0;
    font-size:11px;
    font-weight:700;
    color:var(--blue);
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 9px;
    white-space:nowrap;
  }
  .topbar h1{
    font-family:'Black Han Sans',sans-serif;
    font-size:24px;
    margin:6px 0 8px;
    letter-spacing:0.01em;
  }
  .topbar .note{
    font-size:12.5px;
    color:#D7E6F1;
    line-height:1.6;
    max-width:520px;
  }

  .wrap{ max-width:560px; margin:0 auto; padding-bottom:40px; }

  /* ===== 탭: 6개씩 두 줄 ===== */
  .tabs{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:14px 20px;
    background:var(--blue-deep);
    position:sticky;
    top:0;
    z-index:10;
  }
  .tabs-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs-row::-webkit-scrollbar{ display:none; }
  .tab{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 13px 7px 8px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:700;
    color:#CFE1EE;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.14);
    white-space:nowrap;
    cursor:pointer;
  }
  .tab .n{
    width:18px; height:18px;
    border-radius:50%;
    background:rgba(255,255,255,0.16);
    display:flex; align-items:center; justify-content:center;
    font-size:10px;
    font-weight:800;
  }
  .tab.active{
    background:var(--sun);
    color:#3A2600;
    border-color:var(--sun);
  }
  .tab.active .n{ background:rgba(255,255,255,0.55); color:#3A2600; }

  /* 물결(조개 스캘럽) 구분선 — 청록 블록과 모래빛 본문 사이 */
  .scallop{
    height:12px;
    background:
      radial-gradient(circle at 10px 0, transparent 9px, var(--blue-deep) 9.5px) 0 -1px / 20px 12px repeat-x,
      var(--sand);
  }

  .section{ padding:22px 20px 6px; }
  .cat-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:4px;
  }
  .cat-head .num{
    flex-shrink:0;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--blue);
    color:#fff;
    font-family:'Black Han Sans',sans-serif;
    font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .cat-head h2{ font-size:16px; font-weight:800; margin:0; flex:1; }
  .cat-count{ font-size:12px; color:var(--ink-soft); }
  .cat-desc{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0 0 14px;
    padding-left:36px;
  }

  .doc-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .doc-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 14px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 1px 2px rgba(18,60,99,0.04);
  }
  .doc-item .filetag{
    flex-shrink:0;
    width:34px; height:34px;
    border-radius:9px;
    background:rgba(63,169,197,0.14);
    color:var(--sea-foam);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800;
  }
  .doc-item .filetag.new{ background:rgba(242,169,59,0.18); color:#B9760F; }
  .doc-item .body{ flex:1; min-width:0; }
  .doc-item .title{
    font-size:13.5px; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .doc-item .meta{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }
  .doc-item .go{ color:var(--blue); font-size:14px; flex-shrink:0; }
  .badge-new{
    display:inline-block;
    font-size:10px;
    font-weight:800;
    color:#B9760F;
    background:rgba(242,169,59,0.16);
    padding:1px 6px;
    border-radius:6px;
    margin-left:6px;
    vertical-align:middle;
  }

  .empty{
    background:var(--paper);
    border:1px dashed var(--line);
    border-radius:12px;
    padding:22px 14px;
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-left:36px;
  }
  .doc-list{ margin-left:0; }
  .section .empty{ margin-left:0; }

  .footnote{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    padding:22px 20px 4px;
    line-height:1.7;
  }

  /* ===== 연도별 아코디언 (안전보건 경영방침 등) ===== */
  .year-accordion{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .year-item{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .year-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 14px;
    background:transparent;
    border:none;
    font-family:'Noto Sans KR',sans-serif;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    text-align:left;
  }
  .year-btn .yr-badge{
    flex-shrink:0;
    width:34px; height:34px;
    border-radius:9px;
    background:rgba(29,111,176,0.1);
    color:var(--blue);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800;
  }
  .year-btn .yr-title{ flex:1; }
  .year-btn .chevron{
    flex-shrink:0;
    color:var(--ink-soft);
    font-size:12px;
    transition:transform .3s ease;
  }
  .year-item.open .year-btn .yr-badge{ background:var(--sun); color:#3A2600; }
  .year-item.open .chevron{ transform:rotate(180deg); }
  .year-panel{
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease;
  }
  .year-panel-inner{
    padding:0 14px 14px;
  }
  .year-panel-inner img{
    width:100%;
    display:block;
    border-radius:8px;
    border:1px solid var(--line);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="eyebrow">SOL BEACH SAMCHEOK · WORKER SAFETY</div>
  <h1>근로자 게시자료실</h1>
  <div class="note">「산업안전보건법」에 따라 사업장에 게시·비치해야 하는 자료를 확인 가능하십니다.<br>&nbsp;&nbsp;항목을 누르면 해당 자료를 바로 확인할 수 있습니다.</div>
</div>


<div class="tabs" id="tabs">
  <div class="tabs-row" id="tabs-row-1"></div>
  <div class="tabs-row" id="tabs-row-2"></div>
</div>
<div class="scallop"></div>
<div class="weather-card lv-error" id="weatherCard">
  <span class="wi">🌤️</span>
  <div class="w-body">
    <div class="w-temp">날씨 정보 준비중</div>
    <div class="w-sub">삼척시 평지 기준</div>
  </div>
</div>
<div class="wrap" id="content"></div>

const ROW_SIZE = 6;

function fmtDate(d){ return d ? d.replaceAll('-', '.') : ''; }

function fileTypeLabel(url){
  const clean = (url || '').toLowerCase();
  if(clean.includes('.png')) return 'PNG';
  if(clean.includes('.jpg') || clean.includes('.jpeg')) return 'JPG';
  if(clean.includes('.pdf')) return 'PDF';
  return '자료';
}

function makeTabHTML(c, i, activeKey){
  return `
    <div class="tab ${c.key===activeKey ? 'active':''}" data-key="${c.key}">
      <span class="n">${i+1}</span>${c.short}
    </div>
  `;
}

  row1.innerHTML = CATEGORIES
    .slice(0, ROW_SIZE)
    .map((c,i) => makeTabHTML(c, i, activeKey))
    .join('');

  row2.innerHTML = CATEGORIES
    .slice(ROW_SIZE)
    .map((c,i) => makeTabHTML(c, i + ROW_SIZE, activeKey))
    .join('');

  document.querySelectorAll('#tabs .tab').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.getAttribute('data-key');
      history.replaceState(null,'', `?cat=${key}`);
      render(key);
      el.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
    });
  });
}

function renderContent(activeKey){
  const idx = CATEGORIES.findIndex(c=>c.key===activeKey);
  const cat = idx >= 0 ? CATEGORIES[idx] : CATEGORIES[0];
  const num = (idx >= 0 ? idx : 0) + 1;
  const hasYearDocs = cat.yearDocs && cat.yearDocs.length;
  const totalCount = cat.docs.length + (hasYearDocs ? cat.yearDocs.length : 0);
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = `
    <div class="section">
      <div class="cat-head">
        <span class="num">${num}</span>
        <h2>${cat.name}</h2>
        <span class="cat-count">${totalCount}건</span>
      </div>
      <p class="cat-desc">${cat.desc}</p>
      ${hasYearDocs ? `
        <div class="year-accordion">
          ${cat.yearDocs.map(y => `
            <div class="year-item" data-year="${y.year}">
              <button class="year-btn" type="button">
                <span class="yr-badge">${y.year}</span>
                <span class="yr-title">${y.year}년 안전보건 경영방침</span>
                <span class="chevron">▾</span>
              </button>
              <div class="year-panel">
                <div class="year-panel-inner">
                  <img src="${y.image}" alt="${y.year}년 안전보건 경영방침">
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      ${(!hasYearDocs) ? `
      <div class="doc-list">
        ${cat.docs.length ? cat.docs.map(d => `
          <a class="doc-item" href="${d.fileUrl}" target="_blank" rel="noopener">
            <span class="filetag ${d.isNew ? 'new':''}">${fileTypeLabel(d.fileUrl)}</span>
            <span class="body">
              <span class="title">${d.title}${d.isNew ? '<span class="badge-new">NEW</span>' : ''}</span>
              <span class="meta">${d.date ? '게시일 ' + fmtDate(d.date) : '바로가기'}</span>
            </span>
            <span class="go">→</span>
          </a>
        `).join('') : `<div class="empty">등록된 자료가 없습니다. 준비되는 대로 게시하겠습니다.</div>`}
      </div>
      ` : ''}
    </div>
    <div class="footnote">
      본 페이지는 사업장 게시 의무 자료의 열람 편의를 위해 제공됩니다.<br/>
      원본 서류는 EHS팀에서 관리하며, 문의사항은 EHS팀으로 연락 바랍니다.<br/>
      EHS 담당자 : 033-803-7840 / 내선전화 : 7840
    </div>
  `;

  contentEl.querySelectorAll('.year-item').forEach(item => {
    const btn = item.querySelector('.year-btn');
    const panel = item.querySelector('.year-panel');
    btn.addEventListener('click', () => {
      const isOpen = item.classList.contains('open');
      // 하나만 열리는 아코디언: 다른 항목은 닫기
      contentEl.querySelectorAll('.year-item.open').forEach(other => {
        if(other !== item){
          other.classList.remove('open');
          other.querySelector('.year-panel').style.maxHeight = null;
        }
      });
      if(isOpen){
        item.classList.remove('open');
        panel.style.maxHeight = null;
      } else {
        item.classList.add('open');
        panel.style.maxHeight = panel.scrollHeight + 'px';
      }
    });
  });
}

function render(activeKey){
  renderTabs(activeKey);
  renderContent(activeKey);
}

function init(){
  const params = new URLSearchParams(location.search);
  const cat = params.get('cat');
  const validKey = CATEGORIES.some(c=>c.key===cat) ? cat : CATEGORIES[0].key;
  render(validKey);
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000); // 15분마다 갱신
}

/* ============================================================
   삼척(쏠비치 인근) 실시간 날씨 — 자체 서버(/api/weather)에서
   기상청 초단기실황을 대신 받아와 체감온도까지 계산해서 내려줍니다.
   이 페이지를 Vercel에 배포해야 /api/weather 가 정상 동작합니다.
   ============================================================ */
function weatherIcon(temp){
  if(temp === null || temp === undefined) return '🌤️';
  if(temp <= 0) return '❄️';
  if(temp >= 27) return '☀️';
  return '⛅';
}

async function loadWeather(){
  const card = document.getElementById('weatherCard');
  if(!card) return;

  try{
    const res = await fetch('/api/weather');
    let data;
    try{
      data = await res.json();
    }catch(parseErr){
      throw new Error(`응답 파싱 실패 (status ${res.status})`);
    }
    if(!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

    const icon = weatherIcon(data.temp);
    card.className = `weather-card ${data.level.cls}`;
    card.innerHTML = `
      <span class="wi">${icon}</span>
      <div class="w-body">
        <div class="w-temp">삼척 체감 ${data.feelsLike}℃ <span style="font-weight:600;color:var(--ink-soft);">(기온 ${data.temp}℃ · 습도 ${data.humidity ?? '-'}%)</span></div>
        <div class="w-sub">쏠비치 삼척 인근 실시간 관측 · 매시 자동 갱신</div>
      </div>
      <span class="wlv">${data.level.label}</span>
      <a class="w-naver" href="https://weather.naver.com/today/01230106" target="_blank" rel="noopener">네이버 날씨</a>
    `;
  }catch(err){
    card.className = 'weather-card lv-error';
    card.innerHTML = `
      <span class="wi">🌤️</span>
      <div class="w-body">
        <div class="w-temp">날씨 정보를 불러오지 못했습니다</div>
        <div class="w-sub">오류 내용: ${String(err.message || err)}</div>
      </div>
      <a class="w-naver" href="https://weather.naver.com/today/01230106" target="_blank" rel="noopener">네이버 날씨</a>
    `;
  }
}

init();
</script>
